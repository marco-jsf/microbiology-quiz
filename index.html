<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neuro-Quiz</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/garden.css">
<link rel="stylesheet" href="css/garden-scene.css">
<link rel="stylesheet" href="css/garden-world.css">
<!-- three.js for the 2.5D garden (js/garden3d/), loaded only when the garden tab opens -->
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 Neuro-Quiz</h1>
    <span class="sub">Klausurvorbereitung Neurobiologie · Altklausur-Fragen, Schaubilder, offene Fragen</span>
    <span class="coins" id="coinDisplay" title="Goldmünzen – gibt es für richtige Antworten. Im Garten kannst du sie ausgeben.">
      <i class="coin-ico"></i> <b id="coinCount">0</b>
    </span>
  </header>

  <div class="tabs">
    <button class="tab active" data-mode="quiz">✍️ Üben</button>
    <button class="tab" data-mode="dash">📊 Lernstand</button>
    <button class="tab" data-mode="garden">🐦 Garten</button>
  </div>

  <div class="controls" id="controls">
    <div class="ctl">
      <label for="chapSel">Vorlesung</label>
      <select id="chapSel"></select>
    </div>
    <div class="ctl">
      <label for="topicSel">Thema</label>
      <select id="topicSel"></select>
    </div>
    <div class="ctl">
      <label for="formatSel">Format</label>
      <select id="formatSel"></select>
    </div>
    <div class="ctl">
      <label>Auswahl</label>
      <div class="pill" id="scopePill">
        <button data-s="all" class="on" title="Alle Fragen – Schwaches und Fälliges zuerst">Alle</button>
        <button data-s="new" title="Nur noch nie gesehene Fragen">Neu</button>
        <button data-s="weak" title="Nur Fragen, die noch nicht sitzen">Schwach</button>
        <button data-s="due" title="Wiederholung nach Lernplan fällig">Fällig</button>
      </div>
    </div>
    <div class="ctl">
      <label for="sizeSel">Runde</label>
      <select id="sizeSel" class="narrow">
        <option value="15">15 Fragen</option>
        <option value="30">30 Fragen</option>
        <option value="60">60 Fragen</option>
        <option value="0">alle</option>
      </select>
    </div>
    <div class="ctl">
      <label>&nbsp;</label>
      <label class="check"><input type="checkbox" id="examOnly"> nur Altklausur</label>
    </div>
    <div class="ctl" style="margin-left:auto">
      <label>&nbsp;</label>
      <button class="muted-btn" id="restartBtn">↻ Neue Runde</button>
    </div>
  </div>

  <div class="statbar" id="statbar"></div>
  <div id="view"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
